<div class="popup-overlay" id="loginOverlay">
  <div class="popup">
    <h3>Sign In</h3>
    <input type="tel" id="loginPhone" placeholder="Phone Number *" maxlength="10">
    <input type="text" id="loginName" placeholder="Your Name *">
    <input type="text" id="loginAddress" placeholder="Delivery Address *">
    <select id="loginDelivery">
      <option value="">Mode of Delivery *</option>
      <option value="bus">Bus Delivery</option>
      <option value="lorry">Lorry Service</option>
      <option value="pickup">Pick Up</option>
    </select>
    <input type="email" id="loginEmail" placeholder="Email (Optional)">
    <div id="loginPasswordWrap" style="display:none;">
      <input type="password" id="loginPassword" placeholder="Password">
    </div>
    <p class="popup-error" id="loginError"></p>
    <div class="popup-btns">
      <button class="popup-btn-white" onclick="closeLoginPopup()">Cancel</button>
      <button class="popup-btn-black" onclick="doLogin()">Sign In</button>
    </div>
  </div>
</div>

<header class="top-bar">
  <div class="top-left">
    <button class="icon-btn" onclick="openMenu()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><rect y="4" width="24" height="2.5" rx="1.5"/><rect y="11" width="24" height="2.5" rx="1.5"/><rect y="18" width="24" height="2.5" rx="1.5"/></svg>
    </button>
    <button class="icon-btn cart-btn" onclick="window.location.href='cart.html'">

      <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
  <div class="logo"><img src="images/logo.jpeg" alt="AAMM" class="logo-img"></div>
</header>

<main class="content">
  <div class="search-box">
    <input type="text" id="search" placeholder="Search parts (Bolero armature, 407 bush, Indica stator...)"/>
    <button class="search-icon-btn" onclick="doSearch()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
  </div>

  <section id="recentSection">
    <h3 class="section-title">Recently Visited</h3>
    <div class="scroll-row" id="recent"><p class="empty-row">Visit products to see them here.</p></div>
  </section>

  <section id="topSection">
    <h3 class="section-title">Top Selling</h3>
    <div class="scroll-row" id="top"></div>
  </section>

  <section id="allSection">
    <div class="all-products-header">
      <h3 class="section-title" style="margin-bottom:0;">All Products</h3>
      <div class="filter-row">
        <select class="filter-select" id="filterCat" onchange="onCatChange()"><option value="">All Categories</option></select>
        <select class="filter-select" id="filterSub" onchange="onSubChange()" style="display:none;"><option value="">All Sub-parts</option></select>
        <select class="filter-select" id="filterVeh" onchange="onVehChange()" style="display:none;"><option value="">All Vehicles</option></select>

    </div>
    <div class="big-card-list" id="allproducts"></div>

</main>

<script src="script.js"></script>
<script>
window.addEventListener("load", () => {
  setTimeout(() => { const ls=document.getElementById("loadingScreen"); ls.style.opacity="0"; setTimeout(()=>ls.style.display="none",400); }, 1200);
});

function handleProfileClick() { const u=getUser(); if(u) window.location.href="profile.html"; else openLoginPopup(); }

function updateProfileUI() {
  const u=getUser();
  document.getElementById("hamProfileLabel").textContent = u ? "Profile" : "Sign In";
  if(u && u.profile_photo) document.getElementById("hamProfileImg").src = u.profile_photo;
  else document.getElementById("hamProfileImg").src = "images/logo.jpeg";
}

function openLoginPopup() {
  document.getElementById("loginOverlay").classList.add("active");
  document.getElementById("loginPhone").addEventListener("input", function() {
    document.getElementById("loginPasswordWrap").style.display = this.value==="9344898473"?"block":"none";
  });
}
function closeLoginPopup() { document.getElementById("loginOverlay").classList.remove("active"); }

async function doLogin() {
  const phone=document.getElementById("loginPhone").value.trim();
  const name=document.getElementById("loginName").value.trim();
  const address=document.getElementById("loginAddress").value.trim();
  const delivery=document.getElementById("loginDelivery").value;
  const email=document.getElementById("loginEmail").value.trim();
  const password=document.getElementById("loginPassword").value;
  const errEl=document.getElementById("loginError");
  if(!phone||phone.length<10){errEl.textContent="Enter a valid 10-digit phone number.";return;}
  if(!name){errEl.textContent="Name is required.";return;}
  if(!address){errEl.textContent="Address is required.";return;}
  if(!delivery){errEl.textContent="Please select a delivery mode.";return;}
  try {
    const res=await fetch("/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone,password})});
    const data=await res.json();
    if(!res.ok){errEl.textContent=data.error||"Login failed.";return;}
    await fetch(`/users/${phone}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,address,delivery_pref:delivery,email})});
    saveUser({...data.user,name,address,delivery_pref:delivery,email,isAdmin:data.isAdmin});
    updateProfileUI(); closeLoginPopup(); showToast("Signed in successfully!");
  } catch(e) { errEl.textContent="Server error. Is the server running?"; }
}

function doSearch() {
  const q=document.getElementById("search").value.trim();
  if(!q){showScrollSections();fetchAndRender({});return;}
  hideScrollSections(); fetchAndRender({search:q});
}
document.getElementById("search").addEventListener("keypress",e=>{if(e.key==="Enter")doSearch();});
document.getElementById("search").addEventListener("input",e=>{if(!e.target.value){showScrollSections();fetchAndRender({});}});
function hideScrollSections(){document.getElementById("recentSection").style.display="none";document.getElementById("topSection").style.display="none";}
function showScrollSections(){document.getElementById("recentSection").style.display="";document.getElementById("topSection").style.display="";}

async function loadFilterCategories(){
  const cats=await(await fetch("/products/categories")).json();
  const sel=document.getElementById("filterCat");
  cats.forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;sel.appendChild(o);});
}
async function onCatChange(){
  const cat=document.getElementById("filterCat").value;
  const subSel=document.getElementById("filterSub");
  const vehSel=document.getElementById("filterVeh");
  subSel.innerHTML='<option value="">All Sub-parts</option>';
  vehSel.innerHTML='<option value="">All Vehicles</option>';
  vehSel.style.display="none";
  if(cat){
    const subs=await(await fetch(`/products/subcategories?category=${encodeURIComponent(cat)}`)).json();
    subs.forEach(s=>{const o=document.createElement("option");o.value=s;o.textContent=s;subSel.appendChild(o);});
    subSel.style.display="block";
  } else { subSel.style.display="none"; }
  fetchAndRender(getFilters());
}
async function onSubChange(){
  const cat=document.getElementById("filterCat").value;
  const sub=document.getElementById("filterSub").value;
  const vehSel=document.getElementById("filterVeh");
  vehSel.innerHTML='<option value="">All Vehicles</option>';
  if(sub){
    const vehs=await(await fetch(`/products/vehicles?category=${encodeURIComponent(cat)}&subcategory=${encodeURIComponent(sub)}`)).json();
    vehs.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;vehSel.appendChild(o);});
    vehSel.style.display="block";
  } else { vehSel.style.display="none"; }
  fetchAndRender(getFilters());
}
function onVehChange(){fetchAndRender(getFilters());}
function getFilters(){return{category:document.getElementById("filterCat").value,subcategory:document.getElementById("filterSub").value,vehicle:document.getElementById("filterVeh").value};}
async function fetchAndRender(params={}){
  const qs=new URLSearchParams();
  Object.entries(params).forEach(([k,v])=>{if(v)qs.set(k,v);});
  const data=await(await fetch("/products?"+qs.toString())).json();
  const allEl=document.getElementById("allproducts");
  allEl.innerHTML="";
  if(!data.length){allEl.innerHTML='<p style="color:#555;padding:16px;">No products found.</p>';return;}
  data.forEach(p=>allEl.appendChild(createBigCard(p)));
}

function loadRecentlyVisited(){
  const recent=JSON.parse(localStorage.getItem("aamm_recent")||"[]");
  const el=document.getElementById("recent");
  el.innerHTML="";
  if(!recent.length){el.innerHTML='<p class="empty-row">Visit products to see them here.</p>';return;}
  recent.forEach(p=>el.appendChild(createCard(p)));
}

document.addEventListener("DOMContentLoaded",()=>{
  document.querySelectorAll(".scroll-row").forEach(el=>{
    let isDown=false,startX,scrollLeft;
    el.addEventListener("mousedown",e=>{isDown=true;startX=e.pageX-el.offsetLeft;scrollLeft=el.scrollLeft;});
    el.addEventListener("mouseleave",()=>isDown=false);
    el.addEventListener("mouseup",()=>isDown=false);
    el.addEventListener("mousemove",e=>{if(!isDown)return;e.preventDefault();el.scrollLeft=scrollLeft-(e.pageX-el.offsetLeft-startX);});
  });
});

async function loadProducts(){
  try{
    const top=await(await fetch("/products/top-selling")).json();
    const topEl=document.getElementById("top");
    topEl.innerHTML="";
    top.forEach(p=>topEl.appendChild(createCard(p)));
  }catch(e){}
  fetchAndRender({});
  loadFilterCategories();
  loadRecentlyVisited();
}

updateCartCount();
updateProfileUI();
loadProducts();
</script>
</body>
</html>
