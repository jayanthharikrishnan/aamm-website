<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Secure business management for AAMM Alagar Automobiles."
    />
    <title>Business dashboard · AAMM Alagar Automobiles</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("aamm_theme") === "light" ? "light" : "dark";
      } catch {}
    </script>
    <link rel="icon" href="images/logo.jpeg" type="image/jpeg" />
    <meta property="og:site_name" content="AAMM — Alagar Automobiles" />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="style.css" />
    <style>
      .admin-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 28px;
      }
      .admin-heading h1 {
        margin: 8px 0;
        font-size: clamp(1.8rem, 4vw, 2.7rem);
        letter-spacing: -0.05em;
      }
      .admin-heading p {
        color: var(--muted);
        margin: 0;
      }
      .admin-shell {
        display: grid;
        grid-template-columns: 200px minmax(0, 1fr);
        gap: 28px;
        align-items: start;
      }
      .admin-nav {
        display: grid;
        gap: 5px;
        position: sticky;
        top: 110px;
      }
      .admin-nav button {
        text-align: left;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        padding: 13px 15px;
        border-radius: 8px;
        cursor: pointer;
        font: inherit;
        font-size: 0.88rem;
      }
      .admin-nav button:hover,
      .admin-nav button[aria-current="page"] {
        color: var(--text);
        background: var(--surface);
        border-color: var(--line);
      }
      .admin-nav .admin-nav-end {
        margin-top: 20px;
        border-top: 1px solid var(--line);
        border-radius: 0;
        padding-top: 18px;
      }
      .admin-stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin: 0 0 24px;
      }
      .admin-stat {
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
      }
      .admin-stat strong {
        display: block;
        font-size: 1.9rem;
        font-weight: 650;
        letter-spacing: -0.05em;
        margin: 8px 0;
      }
      .admin-stat span,
      .admin-stat small {
        color: var(--muted);
        font-size: 0.8rem;
      }
      .admin-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 20px;
      }
      .admin-toolbar h2 {
        font-size: 1.4rem;
        margin: 0;
      }
      .admin-toolbar input {
        max-width: 280px;
      }
      .admin-panel {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        padding: 24px;
        margin-bottom: 20px;
      }
      .admin-panel h2 {
        margin: 0 0 12px;
        font-size: 1.2rem;
      }
      .admin-panel p {
        line-height: 1.7;
        color: var(--muted);
      }
      .admin-table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.82rem;
      }
      .admin-table th,
      .admin-table td {
        text-align: left;
        padding: 15px 12px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      .admin-table th {
        color: var(--muted);
        font-weight: 500;
        font-size: 0.72rem;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .admin-table td small {
        display: block;
        color: var(--muted);
        margin-top: 5px;
      }
      .admin-table tr:last-child td {
        border-bottom: 0;
      }
      .admin-status {
        display: inline-block;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 4px 7px;
        font-size: 0.73rem;
        white-space: nowrap;
        color: var(--muted);
      }
      .admin-table-scroll {
        overflow-x: auto;
      }
      .admin-form {
        display: grid;
        gap: 17px;
      }
      .admin-form label {
        display: grid;
        gap: 8px;
        font-size: 0.84rem;
      }
      .admin-form input,
      .admin-form select,
      .admin-form textarea,
      .admin-toolbar input {
        width: 100%;
        min-height: 44px;
        background: var(--surface-2, var(--bg));
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 11px 12px;
        font: inherit;
        font-size: 0.88rem;
        box-sizing: border-box;
      }
      .admin-form textarea {
        resize: vertical;
        min-height: 100px;
      }
      .admin-form .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .admin-form .admin-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .admin-login {
        max-width: 430px;
        margin: 50px auto 90px;
      }
      .admin-login h1 {
        font-size: 1.9rem;
        margin: 8px 0 12px;
        letter-spacing: -0.04em;
      }
      .admin-login p {
        color: var(--muted);
        line-height: 1.65;
        font-size: 0.9rem;
      }
      .admin-error {
        color: #e98585;
        min-height: 1.2em;
        font-size: 0.85rem;
      }
      .admin-note {
        padding: 13px 15px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: 0.82rem;
        line-height: 1.65;
        color: var(--muted);
        margin: 16px 0;
      }
      .admin-dialog {
        width: 560px;
        max-width: calc(100vw - 32px);
        max-height: 90vh;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 26px;
        background: var(--surface);
        color: var(--text);
      }
      .admin-dialog::backdrop {
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(3px);
      }
      .admin-dialog-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 22px;
      }
      .admin-dialog-top h2 {
        margin: 0;
        font-size: 1.35rem;
      }
      .admin-close {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        border-radius: 6px;
        cursor: pointer;
        width: 34px;
        height: 34px;
        font-size: 22px;
      }
      .admin-detail {
        margin: 12px 0 22px;
        display: grid;
        gap: 10px;
        font-size: 0.86rem;
        line-height: 1.65;
      }
      .admin-detail span {
        color: var(--muted);
      }
      .admin-detail pre {
        white-space: pre-wrap;
        word-break: break-word;
        font: inherit;
        background: var(--surface-2, var(--bg));
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        max-height: 200px;
        overflow: auto;
      }
      .admin-loading {
        color: var(--muted);
        padding: 45px 0;
      }
      .admin-empty {
        border: 1px dashed var(--line);
        border-radius: 10px;
        padding: 40px 24px;
        color: var(--muted);
        text-align: center;
        line-height: 1.7;
      }
      .admin-config {
        display: grid;
        gap: 12px;
      }
      .admin-config-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
        font-size: 0.86rem;
      }
      @media (max-width: 850px) {
        .admin-shell {
          grid-template-columns: 1fr;
          gap: 20px;
        }
        .admin-nav {
          position: static;
          display: flex;
          overflow: auto;
          padding-bottom: 6px;
        }
        .admin-nav button {
          white-space: nowrap;
        }
        .admin-nav .admin-nav-end {
          margin: 0;
          border: 0;
          padding: 13px 15px;
        }
        .admin-stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .admin-panel {
          padding: 18px;
        }
      }
      @media (max-width: 480px) {
        .admin-heading {
          align-items: start;
        }
        .admin-heading p {
          max-width: 220px;
          font-size: 0.85rem;
        }
        .admin-form .form-grid {
          grid-template-columns: 1fr;
        }
        .admin-dialog {
          padding: 20px;
        }
        .admin-stat {
          padding: 17px;
        }
        .admin-stat strong {
          font-size: 1.6rem;
        }
      }
    </style>
  </head>
  <body>
    <header id="siteHeader"></header>
    <main id="adminApp" class="container page-main">
      <p class="admin-loading" role="status">Checking your secure session…</p>
    </main>
    <footer id="siteFooter"></footer>
    <dialog
      id="adminDialog"
      class="admin-dialog"
      aria-labelledby="adminDialogTitle"
    ></dialog>
    <script src="script.js" defer></script>
    <script src="admin.js" defer></script>
  </body>
</html>
