<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Manage products, orders and customer requests at Alagar Automobiles.">
  <title>Manage your shop · Alagar Automobiles</title>
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('aamm_theme_v2') === 'dark' ? 'dark' : 'light'; } catch {}</script>
  <link rel="icon" href="images/logo.jpeg" type="image/jpeg">
  <meta property="og:site_name" content="Alagar Automobiles">
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-main{max-width:1120px;min-height:60vh;padding-top:36px;padding-bottom:72px}
    .admin-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
    .admin-heading h1{font-size:clamp(1.55rem,3vw,2rem);font-weight:600;letter-spacing:-.035em;margin:0}
    .admin-heading p{font-size:.88rem;color:var(--muted);margin:7px 0 0}
    .admin-nav{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:28px}
    .admin-nav button,.admin-more summary{min-height:44px;padding:10px 16px;border:1px solid transparent;border-radius:7px;font:inherit;font-size:.9rem;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
    .admin-nav button[aria-current="page"]{background:var(--surface-2);border-color:var(--line);color:var(--text);font-weight:600}
    .admin-nav button:hover,.admin-more summary:hover{color:var(--text);background:var(--surface-2)}
    .admin-more{position:relative;margin-left:auto}
    .admin-more summary{list-style:none;display:flex;align-items:center;gap:8px}
    .admin-more summary::-webkit-details-marker{display:none}
    .admin-more summary::after{content:'⌄';font-size:1rem}
    .admin-more-menu{position:absolute;z-index:20;right:0;top:48px;min-width:200px;padding:7px;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:0 12px 30px #00000014;display:grid;gap:2px}
    .admin-more-menu button{text-align:left;width:100%;border:0}
    .admin-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
    .admin-toolbar h2{font-size:1.2rem;font-weight:600;letter-spacing:-.02em;margin:0}
    .admin-count{font-size:.85rem;color:var(--muted);font-weight:400;margin-left:8px}
    .admin-search{margin-bottom:20px;max-width:520px}
    .admin-search label{display:block;font-size:.84rem;margin-bottom:8px;color:var(--muted)}
    .admin-panel{padding:24px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:20px}
    .admin-panel h2,.admin-panel h3{font-size:1.15rem;margin:0 0 12px;font-weight:600}
    .admin-panel p{font-size:.9rem;line-height:1.7;color:var(--muted);margin:10px 0}
    .admin-table-scroll{max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
    .admin-table{border-collapse:collapse;width:100%;font-size:.86rem}
    .admin-table th,.admin-table td{text-align:left;padding:16px;border-bottom:1px solid var(--line);vertical-align:middle}
    .admin-table th{font-size:.75rem;color:var(--muted);font-weight:500;background:var(--surface-2);white-space:nowrap}
    .admin-table td small{display:block;font-size:.76rem;color:var(--muted);margin-top:5px;line-height:1.5}
    .admin-table tr:last-child td{border-bottom:0}
    .admin-table td:last-child{white-space:nowrap;text-align:right}
    .admin-table th:last-child{text-align:right}
    .admin-table strong{font-weight:500}
    .admin-status{display:inline-block;padding:4px 8px;font-size:.75rem;border:1px solid var(--line);border-radius:5px;color:var(--muted);white-space:nowrap;line-height:1.5}
    .admin-form{display:grid;gap:17px}
    .admin-form label{display:grid;gap:8px;font-size:.85rem;line-height:1.5}
    .admin-form input,.admin-form textarea,.admin-form select,.admin-search input{width:100%;min-height:46px;padding:11px 12px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text);font:inherit;font-size:.9rem;box-sizing:border-box}
    .admin-form textarea{min-height:95px;resize:vertical}
    .admin-form input:focus,.admin-form textarea:focus,.admin-form select:focus,.admin-search input:focus{outline:2px solid var(--accent);outline-offset:2px}
    .admin-form .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .admin-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
    .admin-actions .button{min-height:44px}
    .admin-login{max-width:420px;margin:24px auto 60px}
    .admin-login h1{font-size:1.8rem;font-weight:600;letter-spacing:-.035em;margin:0 0 12px}
    .admin-login>p{margin-bottom:24px}
    .admin-error{font-size:.85rem;color:#bf3c31;line-height:1.6;margin:0}
    .admin-error:empty{display:none}
    .admin-note{padding:13px 15px;border:1px solid var(--line);border-radius:7px;font-size:.83rem;line-height:1.65;color:var(--muted);margin:16px 0;background:var(--surface-2)}
    .admin-note p{font-size:inherit;margin:0}
    .admin-details{border-top:1px solid var(--line);padding-top:15px}
    .admin-details summary{cursor:pointer;font-size:.86rem;line-height:1.6;min-height:32px;color:var(--muted)}
    .admin-details[open] summary{margin-bottom:16px;color:var(--text)}
    .admin-details .admin-form{margin-top:14px}
    .admin-details code{font-size:.78rem;display:block;padding:12px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);background:var(--bg);border-radius:6px;color:var(--text)}
    .admin-setup-list{margin:12px 0 16px;padding-left:20px;color:var(--muted);font-size:.84rem;line-height:1.8}
    .admin-config-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);font-size:.88rem}
    .admin-config-row:first-child{padding-top:0}.admin-config-row:last-child{border-bottom:0;padding-bottom:0}
    .admin-segments{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
    .admin-segments button{font:inherit;font-size:.86rem;padding:9px 14px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;min-height:42px}
    .admin-segments button[aria-pressed="true"]{background:var(--surface-2);color:var(--text)}
    .admin-dialog{width:590px;max-width:calc(100vw - 28px);max-height:90vh;overflow:auto;padding:26px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);box-sizing:border-box}
    .admin-dialog::backdrop{background:#0007;backdrop-filter:blur(2px)}
    .admin-dialog-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}
    .admin-dialog-top h2{font-size:1.35rem;font-weight:600;margin:0;letter-spacing:-.025em}
    .admin-close{width:38px;height:38px;flex-shrink:0;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--text);font-size:22px;cursor:pointer}
    .admin-detail{font-size:.86rem;line-height:1.7;margin-bottom:22px;color:var(--muted)}
    .admin-detail p{margin:8px 0}.admin-detail strong{font-weight:500;color:var(--text)}
    .admin-detail pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:7px;max-height:180px;overflow:auto}
    .admin-documents{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}
    .admin-documents a{font-size:.84rem;text-decoration:underline;text-underline-offset:3px}
    .admin-loading{padding:30px 0;color:var(--muted);font-size:.9rem}
    .admin-empty{text-align:center;padding:48px 22px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:.9rem;line-height:1.7;background:var(--surface)}
    .admin-show-more{margin:18px auto 0;display:block}
    @media(max-width:600px){.admin-main{padding-top:24px}.admin-heading{align-items:start}.admin-heading h1{font-size:1.5rem}.admin-heading p{max-width:230px;font-size:.8rem}.admin-nav{gap:2px}.admin-nav button,.admin-more summary{padding:9px 11px;font-size:.82rem}.admin-more{margin-left:0}.admin-more-menu{left:0;right:auto}.admin-form .form-grid{grid-template-columns:1fr}.admin-dialog{padding:20px}.admin-panel{padding:20px}.admin-table th,.admin-table td{padding:13px 11px}.admin-table{font-size:.81rem}.admin-table .optional-column,.admin-table .admin-product-category{display:none}.admin-search{max-width:none}.admin-login{margin-top:12px}.admin-config-row{gap:10px;align-items:start}}
  </style>
</head>
<body data-page="admin">
  <a class="skip-link" href="#adminApp">Skip to content</a>
  <header id="siteHeader"></header>
  <main id="adminApp" class="container page-main admin-main"><p class="admin-loading" role="status">Loading…</p></main>
  <footer id="siteFooter"></footer>
  <dialog id="adminDialog" class="admin-dialog" aria-labelledby="adminDialogTitle"></dialog>
  <script src="script.js" defer></script>
  <script src="admin.js" defer></script>
</body>
</html>
